# HIVE OS — machine configuration
# Fill in real values when on-site in India.
# energy_meter section covers compressors + dust collectors (current clamp → Modbus energy meter)

mqtt:
  broker_host: "127.0.0.1"   # replace with central broker IP on factory LAN
  broker_port: 1883
  keepalive: 60
  topic_prefix: "hive/machines"

# Thresholds for current-clamp state detection.
# on_threshold_w:   above this = machine is ON and loaded
# idle_threshold_w: above this but below on = machine is running unloaded
# Below idle = OFF
energy_defaults:
  on_threshold_w: 2000
  idle_threshold_w: 300
  poll_interval_s: 5

energy_meters:
  - machine_key: elgi_1
    label: "Elgi Compressor 1"
    modbus_host: "192.168.1.51"   # replace with real IP
    modbus_port: 502
    unit_id: 1
    on_threshold_w: 5000
    idle_threshold_w: 500

  - machine_key: elgi_2
    label: "Elgi Compressor 2"
    modbus_host: "192.168.1.52"
    modbus_port: 502
    unit_id: 1
    on_threshold_w: 5000
    idle_threshold_w: 500

  - machine_key: aarco_1
    label: "Aarco Dust Collector 1"
    modbus_host: "192.168.1.53"
    modbus_port: 502
    unit_id: 1
    on_threshold_w: 2000
    idle_threshold_w: 300

  - machine_key: aarco_2
    label: "Aarco Dust Collector 2"
    modbus_host: "192.168.1.54"
    modbus_port: 502
    unit_id: 1
    on_threshold_w: 2000
    idle_threshold_w: 300

